name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

# A newer push to the same branch supersedes the running build. Tag builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: Aligna-linux
            archive: Aligna-linux.tar.gz
          - os: macos-latest
            artifact: Aligna-macos
            archive: Aligna-macos.zip
          - os: windows-2022
            artifact: Aligna-windows
            archive: Aligna-windows.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Archive here: upload/download-artifact drops permissions (executable
      # bits) and flattens directories, so ship single archive files.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp build/Aligna_artefacts/Release/Aligna "$stage/"
          cp LICENSE THIRD-PARTY-NOTICES.txt build/LICENSE-LAME.txt build/LICENSE-RubberBand.txt "$stage/"
          tar -C "$stage" -czf ${{ matrix.archive }} Aligna LICENSE LICENSE-LAME.txt LICENSE-RubberBand.txt THIRD-PARTY-NOTICES.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          ditto build/Aligna_artefacts/Release/Aligna.app "$stage/Aligna.app"
          cp LICENSE THIRD-PARTY-NOTICES.txt build/LICENSE-LAME.txt build/LICENSE-RubberBand.txt "$stage/"
          # No --keepParent: the zip root holds Aligna.app and the license files side by side.
          ditto -c -k "$stage" "$GITHUB_WORKSPACE/${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath ${{ matrix.archive }} -Path `
            build/Aligna_artefacts/Release/Aligna.exe, LICENSE, THIRD-PARTY-NOTICES.txt, `
            build/LICENSE-LAME.txt, build/LICENSE-RubberBand.txt

      # The installer: per-user, no administrator prompt, registers .aligna (installer/windows/Aligna.iss).
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) not found" }
          $m = Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$'
          if (-not $m) { throw "Project version not found in build/CMakeCache.txt" }
          $version = $m.Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\build\Aligna_artefacts\Release\Aligna.exe" `
            "/DBuildDir=$PWD\build" "/DRepoDir=$PWD" "/O$PWD" installer\windows\Aligna.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path Aligna-windows-setup.exe)) { throw "The installer was not produced" }

      # Install silently, check what the installer promises, uninstall, check that it is gone.
      - name: Test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\Aligna-windows-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\install.log"
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "Install failed with exit code $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Aligna"
          foreach ($f in 'Aligna.exe', 'LICENSE.txt', 'THIRD-PARTY-NOTICES.txt', 'LICENSE-LAME.txt', 'LICENSE-RubberBand.txt', 'unins000.exe') {
            if (-not (Test-Path "$app\$f")) { Get-Content install.log; throw "Not installed: $app\$f" }
          }
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Aligna.lnk"
          if (-not (Test-Path $shortcut)) { throw "No Start menu shortcut: $shortcut" }
          $ext = (Get-Item 'HKCU:\Software\Classes\.aligna').GetValue('')
          if ($ext -ne 'Aligna.Project') { throw ".aligna is registered as '$ext'" }
          $cmd = (Get-Item 'HKCU:\Software\Classes\Aligna.Project\shell\open\command').GetValue('')
          $expected = "`"$app\Aligna.exe`" `"%1`""
          if ($cmd -ne $expected) { throw "Open command is '$cmd', expected '$expected'" }
          if (Get-Process Aligna -ErrorAction SilentlyContinue) { throw "A silent install must not start Aligna" }

          Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\Aligna.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\Aligna.exe") { throw "Uninstall left $app\Aligna.exe" }
          if (Test-Path 'HKCU:\Software\Classes\Aligna.Project') { throw "Uninstall left the .aligna registration" }
          if (Test-Path $shortcut) { throw "Uninstall left the Start menu shortcut" }

      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Aligna-windows-setup
          path: Aligna-windows-setup.exe
          if-no-files-found: error

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
