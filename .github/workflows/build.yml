name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: Aligna-linux
            path: build/Aligna_artefacts/Release/Aligna
          - os: macos-14
            artifact: Aligna-macos
            path: build/Aligna_artefacts/Release/Aligna.app
          - os: windows-2022
            artifact: Aligna-windows
            path: build/Aligna_artefacts/Release/Aligna.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir dist
          tar -C artifacts/Aligna-linux -czf dist/Aligna-linux.tar.gz Aligna
          (cd artifacts/Aligna-macos && zip -r -y ../../dist/Aligna-macos.zip .)
          (cd artifacts/Aligna-windows && zip -r ../../dist/Aligna-windows.zip Aligna.exe)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
