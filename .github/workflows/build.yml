name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

# A newer push to the same branch supersedes the running build. Tag builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: Aligna-linux
            archive: Aligna-linux.tar.gz
          - os: macos-latest
            artifact: Aligna-macos
            archive: Aligna-macos.zip
          - os: windows-2022
            artifact: Aligna-windows
            archive: Aligna-windows.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Archive here: upload/download-artifact drops permissions (executable
      # bits) and flattens directories, so ship single archive files.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp build/Aligna_artefacts/Release/Aligna "$stage/"
          cp LICENSE THIRD-PARTY-NOTICES.txt build/LICENSE-LAME.txt build/LICENSE-RubberBand.txt "$stage/"
          tar -C "$stage" -czf ${{ matrix.archive }} Aligna LICENSE LICENSE-LAME.txt LICENSE-RubberBand.txt THIRD-PARTY-NOTICES.txt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          ditto build/Aligna_artefacts/Release/Aligna.app "$stage/Aligna.app"
          cp LICENSE THIRD-PARTY-NOTICES.txt build/LICENSE-LAME.txt build/LICENSE-RubberBand.txt "$stage/"
          # No --keepParent: the zip root holds Aligna.app and the license files side by side.
          ditto -c -k "$stage" "$GITHUB_WORKSPACE/${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath ${{ matrix.archive }} -Path `
            build/Aligna_artefacts/Release/Aligna.exe, LICENSE, THIRD-PARTY-NOTICES.txt, `
            build/LICENSE-LAME.txt, build/LICENSE-RubberBand.txt

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
