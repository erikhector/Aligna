name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: Aligna-linux
            archive: Aligna-linux.tar.gz
          - os: macos-14
            artifact: Aligna-macos
            archive: Aligna-macos.zip
          - os: windows-2022
            artifact: Aligna-windows
            archive: Aligna-windows.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Archive here: upload/download-artifact drops permissions (executable
      # bits) and flattens directories, so ship single archive files.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C build/Aligna_artefacts/Release -czf ${{ matrix.archive }} Aligna

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/Aligna_artefacts/Release
          ditto -c -k --keepParent Aligna.app "$GITHUB_WORKSPACE/${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Aligna_artefacts/Release/Aligna.exe -DestinationPath ${{ matrix.archive }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
